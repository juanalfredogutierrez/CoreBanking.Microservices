apiVersion: apps/v1
kind: Deployment

metadata:
  name: accountservice
  namespace: banking

spec:
  replicas: 1

  selector:
    matchLabels:
      app: accountservice

  template:
    metadata:
      labels:
        app: accountservice

    spec:
      containers:
      - name: accountservice

        image: accountservice:1.0

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 5001

        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"

        - name: ASPNETCORE_URLS
          value: "http://+:5001"

        - name: ConnectionStrings__DefaultConnection
          value: "Server=sqlserver-service;Database=AccountDb;User Id=sa;Password=TuPassword123!;TrustServerCertificate=True;"

        - name: CustomerServiceUrl
          value: "http://customerservice-service"